name: basil
description: "Basil: fast number base converter, calculator, lessons and timed training (binary, octal, decimal, hexadecimal and any base 2-36)."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled (SIL Open Font License): the app never contacts
  # Google Fonts or any other third-party server.
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
        - asset: assets/fonts/Silkscreen-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/OFL-JetBrainsMono.txt
    - assets/fonts/OFL-VT323.txt
    - assets/fonts/OFL-Silkscreen.txt
